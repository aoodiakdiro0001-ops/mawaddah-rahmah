name: Android APK (Mawaddah & Rahmah)

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17 (Gradle compatibility)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true

      # The repo keeps lib/ + assets + pubspec only; android/ scaffolding is
      # generated here so we never hand-maintain gradle files.
      - name: Scaffold Android platform
        run: |
          cd flutter_app
          flutter create . --platforms android --project-name mawaddah --org ly.mawaddah --no-pub
          # discard the generated default widget_test (it references MyApp we don't ship)
          rm -f test/widget_test.dart
          # Transitive deps (androidx.annotation 1.9.x, kotlin-stdlib 1.9.24) ship
          # Kotlin metadata 1.9.0 that an old template Kotlin plugin (1.7.10) can't
          # read. The pin lives either in classic android/build.gradle or
          # declarative android/settings.gradle — align both when present.
          sed -i.bak "s/ext.kotlin_version *= *'[^']*'/ext.kotlin_version = '1.9.24'/" android/build.gradle
          sed -i.bak 's/org.jetbrains.kotlin.android" version "[^"]*"/org.jetbrains.kotlin.android" version "1.9.24"/' android/settings.gradle
          rm -f android/build.gradle.bak android/settings.gradle.bak
          grep -Hn "kotlin_version\|kotlin.android" android/build.gradle android/settings.gradle || true

      - name: Pub get
        run: |
          cd flutter_app
          flutter pub get

      - name: Unit tests (content layer smoke)
        run: |
          cd flutter_app
          flutter test test/smoke_test.dart

      - name: Analyze (info-level allowed, errors fail)
        run: |
          cd flutter_app
          flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Build release APK
        run: |
          cd flutter_app
          flutter build apk --release

      - name: Upload build artifact (every run)
        uses: actions/upload-artifact@v4
        with:
          name: mawaddah-apk
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk

      - name: Create GitHub release (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: flutter_app/build/app/outputs/flutter-apk/app-release.apk
          name: Mawaddah & Rahmah ${{ github.ref_name }}
          body: |
            إصدار APK من «مودة ورحمة» — تثبيت مباشر (Enable unknown sources عند التثبيت).
            Honest build log: content assets (guidance/tips/harmony) are bundled inside the APK.
